<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hồng Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Bộ áo OTL V7 (xám đá + đỏ, xanh dương ít) · HUD/FUI phẳng: nét mảnh, dấu ngoặc góc, số đơn cách.
   Luật chủ máy: không bóng, không quầng, không gradient, không đen, không vạch màu ở mép ô.
   120 Hz: chỉ transform/opacity trong CSS; canvas vẽ lớp tĩnh 1 lần / lần có số, mỗi khung chỉ vẽ phần động. */
:root{
  --nen:#E7E5E4; --mat:#F5F5F4; --the:#FFFFFF; --vien:#D6D3D1; --vien-dam:#A8A29E;
  --chu:#44403C; --mo:#6F6A65; --do:#B91C1C; --do-nhat:#FEE2E2; --nau:#8D5524; --nau-nhat:#F3E8DC;
  --xanh:#1565C0; --xanh-nhat:#E2ECF7; --ho:#B45309; --ho-nhat:#FEF3C7;
  --so:"Fira Code",Consolas,monospace;
  --c-xs:11.5px; --c-s:12.5px; --c-m:14px; --c-l:18px; --c-xl:24px; --c-2xl:32px;
  --r-s:6px; --r-m:8px; --r-l:12px; --k-1:8px; --k-2:12px; --k-3:16px;
  --nhanh:160ms; --vua:240ms; --em:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--nen);color:var(--chu);font:var(--c-m)/1.5 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.trang{display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh;gap:var(--k-2);padding:var(--k-2)}
/* ---- thanh trên ---- */
.tren{display:grid;grid-template-columns:auto auto minmax(240px,1fr) auto;gap:var(--k-3);align-items:center;background:var(--the);border-radius:var(--r-l);padding:var(--k-2) var(--k-3)}
.hieu{display:flex;flex-direction:column}
.hieu h1{margin:0;font-size:var(--c-l);font-weight:700;letter-spacing:.2px}
.hieu span{font-size:var(--c-xs);color:var(--mo);font-family:var(--so)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--c-xs);font-weight:700;letter-spacing:.5px;padding:5px 10px;border-radius:var(--r-s);background:var(--mat);color:var(--mo);white-space:nowrap}
.chip.lam{background:var(--do);color:#fff}
.chip.ho{background:var(--ho-nhat);color:var(--ho)}
.chip.xanh{background:var(--xanh-nhat);color:var(--xanh)}
.tam_giac{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid currentColor}
.viec{font-size:var(--c-s);color:var(--mo);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:360px}
.viec b{color:var(--chu);font-weight:600}
#ray{width:100%;height:58px;display:block}
.gio{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.gio .dh{font-family:var(--so);font-size:var(--c-xl);font-weight:600;letter-spacing:.5px;line-height:1.1}
.gio .dem{font-family:var(--so);font-size:var(--c-xs);color:var(--mo)}
/* ---- lưới chính ---- */
.luoi{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:var(--k-2);min-height:0}
.cot{display:flex;flex-direction:column;gap:var(--k-2);min-height:0}
.o{background:var(--the);border-radius:var(--r-l);position:relative;min-height:0}
.o .dau{display:flex;align-items:center;gap:var(--k-2);padding:var(--k-2) var(--k-3) 0;flex-wrap:wrap}
.o .dau h2{margin:0;font-size:var(--c-s);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.o .dau .phu{font-size:var(--c-xs);color:var(--mo);font-family:var(--so)}
.ngoac::before,.ngoac::after{content:"";position:absolute;width:14px;height:14px;border:1.5px solid var(--vien-dam);pointer-events:none}
.ngoac::before{left:6px;top:6px;border-right:0;border-bottom:0}
.ngoac::after{right:6px;bottom:6px;border-left:0;border-top:0}
.gd{flex:1;display:flex;flex-direction:column}
.khung_gd{flex:1;position:relative;min-height:0}
#gd{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.chu_giai_gd{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.cg,.nut,.tab button{font:inherit;font-size:var(--c-xs);font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;min-height:36px;border-radius:var(--r-m);border:1px solid var(--vien);background:var(--mat);color:var(--chu);cursor:pointer;
  transition:background-color var(--nhanh),color var(--nhanh),opacity var(--nhanh),transform var(--nhanh) var(--em);touch-action:manipulation}
.cg:hover,.nut:hover,.tab button:hover{background:var(--the)}
.cg:active,.nut:active,.tab button:active{transform:scale(.96)}
.cg.tat{opacity:.5}.cg.tat .ten{text-decoration:line-through}
.cg:focus-visible,.nut:focus-visible,.tab button:focus-visible{outline:3px solid var(--xanh);outline-offset:2px}
.cg svg{width:22px;height:8px;flex:none}
.nut.on,.tab button.on{background:var(--do);border-color:var(--do);color:#fff}
/* thông số */
.so{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--nen);border-radius:var(--r-l);overflow:hidden}
.tl{background:var(--the);padding:var(--k-1) var(--k-2) 6px;min-width:0}
.tl .t{font-size:var(--c-xs);font-weight:700;color:var(--mo);letter-spacing:.4px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .g{font-family:var(--so);font-size:var(--c-xl);font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl .g small{font-size:var(--c-s);color:var(--mo);margin-left:2px;font-weight:500}
.tl .p{font-size:var(--c-xs);color:var(--mo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:17px}
.tl .p b{color:var(--chu)}
.tl canvas{width:100%;height:22px;display:block;margin-top:2px}
.tl.chinh .g{font-size:var(--c-2xl);color:var(--xanh)}
.tu{display:inline-block;font-size:var(--c-xs);font-weight:700;letter-spacing:.3px;padding:0 5px;border-radius:4px;margin-left:4px}
.pha_bar{grid-column:1/-1;background:var(--the);padding:var(--k-1) var(--k-2);display:grid;grid-template-columns:auto 1fr;gap:var(--k-2);align-items:center}
.pha_bar .t{font-size:var(--c-xs);font-weight:700;color:var(--mo);letter-spacing:.4px;text-transform:uppercase}
.vach{display:flex;height:26px;border-radius:var(--r-s);overflow:hidden;background:var(--mat);font-size:var(--c-xs);font-weight:600}
.vach div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;min-width:0}
/* sơ đồ */
.sd{flex:1;min-height:260px}
#so_do{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;border-radius:var(--r-l)}
.noi{position:absolute;background:rgba(255,255,255,.95);border:1px solid var(--vien);border-radius:var(--r-m);padding:var(--k-1) 10px;font-size:var(--c-xs)}
.cg_sd{left:12px;top:12px}
.cg_sd div{display:flex;align-items:center;gap:7px;margin:2px 0}
.cg_sd i{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.dieu{right:12px;top:12px;display:flex;gap:6px;padding:5px}
#chi_tiet{left:12px;bottom:12px;right:12px;max-height:46%;overflow:auto;display:none;font-size:var(--c-s)}
#chi_tiet button{float:right}
/* nhật ký */
.vl{height:34%;min-height:190px;display:flex;flex-direction:column}
.tab{display:flex;gap:6px;padding:10px 12px 6px}
.dong{flex:1;overflow:auto;padding:0 12px 10px;min-height:0;overscroll-behavior:contain}
.sk{padding:8px 0;border-bottom:1px solid var(--nen);font-size:var(--c-s);line-height:1.55}
.sk.moi{animation:vao var(--vua) var(--em) both}
@keyframes vao{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sk .gi{color:var(--mo);font-family:var(--so);font-size:var(--c-xs);margin-right:6px}
.sk .n{display:inline-block;font-size:var(--c-xs);font-weight:700;padding:0 6px;border-radius:4px;margin-right:6px;letter-spacing:.3px}
.sk pre{white-space:pre-wrap;word-break:break-word;margin:6px 0 0;background:var(--mat);border-radius:var(--r-s);padding:var(--k-1);font:var(--c-xs)/1.5 var(--so);display:none;max-height:240px;overflow:auto}
.sk.mo pre{display:block}
.trong{color:var(--mo);padding:20px 4px;text-align:center}
@media (pointer:coarse){.cg,.nut,.tab button{min-height:44px;padding:8px 12px}}
@media (max-height:820px) and (min-width:1181px){.tl canvas{display:none}.tl .g{font-size:20px}.tl.chinh .g{font-size:26px}.tl{padding:6px 10px 4px}
  .cg_sd{display:none}.vl{height:31%}.vach{height:22px}#ray{height:52px}}
@media (max-width:1180px){body{overflow:auto}.trang{height:auto}.luoi{grid-template-columns:1fr}.gd{min-height:480px}.sd{min-height:440px}.vl{height:auto;max-height:420px}
  .so{grid-template-columns:repeat(3,minmax(0,1fr))}.tren{grid-template-columns:1fr auto}#ray{grid-column:1/-1}.viec{display:none}}
@media (max-width:640px){.vach .dai{display:none}.pha_bar{grid-template-columns:1fr}.trang{padding:8px;gap:8px}.so{grid-template-columns:repeat(2,minmax(0,1fr))}.gd{min-height:420px}.cg_sd{display:none}
  .cot,.gd,.gd .dau{min-width:0}.chu_giai_gd{flex:1 1 100%;min-width:0;margin-left:0;flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none;padding-bottom:2px}.cg{flex:none}.gd{min-height:480px}.tren{padding:10px 12px}.gio .dh{font-size:var(--c-l)}}
@media (prefers-reduced-motion:reduce){.sk.moi{animation:none}*{transition-duration:0s!important}}
</style>
</head>
<body>
<div class="trang">
  <header class="tren">
    <div class="hieu"><h1>OTL Hồng · Live</h1><span id="thu_muc">—</span></div>
    <div style="display:flex;flex-direction:column;gap:4px"><span class="chip" id="chip_tt">ĐANG NỐI</span><span class="viec" id="viec">—</span></div>
    <canvas id="ray" role="img" aria-label="Tiến trình mẻ: mốc thật so với đích"></canvas>
    <div class="gio"><span class="dh" id="dong_ho">--:--</span><span id="chip_cu"></span><span class="dem" id="dem">—</span></div>
  </header>
  <p class="sr" id="tom_tat" aria-live="polite"></p>
  <main class="luoi">
    <div class="cot">
      <section class="o ngoac gd" aria-labelledby="h_gd">
        <div class="dau"><h2 id="h_gd">Giản đồ rang</h2><span class="phu" id="gd_phu">—</span>
          <div class="chu_giai_gd" id="chu_giai_gd" role="group" aria-label="Bật tắt đường"></div></div>
        <div class="khung_gd"><canvas id="gd" role="img" aria-label="Giản đồ rang"></canvas></div>
      </section>
      <section class="so" id="so" aria-label="Thông số máy"></section>
    </div>
    <div class="cot">
      <section class="o ngoac sd" aria-label="Sơ đồ việc Hồng đang làm">
        <canvas id="so_do" role="img" aria-label="Sơ đồ việc Hồng đang làm — xem danh sách bên dưới"></canvas>
        <div class="noi cg_sd" aria-hidden="true">
          <div><i style="background:var(--do)"></i>ĐANG LÀM</div>
          <div><i style="background:var(--nau)"></i>HỒNG BÁO</div>
          <div><i style="background:var(--mat);border:2px solid var(--vien-dam)"></i>XONG</div>
          <div><span class="tam_giac" style="color:var(--ho)"></span>LỖI · nháy tới khi xem</div>
          <div><i style="background:var(--xanh)"></i>LỆNH ANH</div>
        </div>
        <div class="noi dieu"><button class="nut on" id="b_chuyen" aria-pressed="true">Chuyển động: BẬT</button><button class="nut" id="b_ve">Xáo lại</button></div>
        <div class="noi" id="chi_tiet" role="dialog" aria-live="polite"></div>
      </section>
      <section class="o vl" aria-label="Nhật ký">
        <div class="tab" role="tablist"><button class="on" data-t="sk" role="tab" aria-selected="true">Việc Hồng làm</button><button data-t="me" role="tab" aria-selected="false">Nhật ký mẻ</button></div>
        <div class="dong" id="dong"></div>
      </section>
    </div>
  </main>
</div>
<script>
"use strict";
const C={nen:'#E7E5E4',mat:'#F5F5F4',the:'#FFFFFF',vien:'#D6D3D1',vienDam:'#A8A29E',chu:'#44403C',mo:'#6F6A65',luoi:'#EEECEA',
  do:'#B91C1C',doNhat:'#FEE2E2',nau:'#8D5524',nauNhat:'#F3E8DC',xanh:'#1565C0',xanhNhat:'#E2ECF7',ho:'#B45309'};
const FONT='"Be Vietnam Pro",Segoe UI,sans-serif', SO='"Fira Code",Consolas,monospace';
const KIEU={dang_lam:{nen:C.do,vien:C.do,ten:'ĐANG LÀM'},can_nhac:{nen:C.nau,vien:C.nau,ten:'HỒNG BÁO'},
  xong:{nen:C.mat,vien:C.vienDam,ten:'XONG'},loi:{nen:C.ho,vien:C.ho,ten:'LỖI'},lenh:{nen:C.xanh,vien:C.xanh,ten:'LỆNH ANH'}};
const NHOM=[['lenh','Việc anh giao'],['nghi','Hồng báo'],['doc','Đọc máy'],['dubao','Dự báo'],['hmi','Thao tác máy'],
            ['ghi','Ghi giản đồ'],['phantich','Phân tích'],['nho','Ghi nhớ'],['tra','Tra cứu']];
const MOI_NHOM=3, HAT_CANH=2;   // ít nút, ít hạt chạy ⇒ đỡ rối mắt
let S=null, tab='sk', chuyen=!matchMedia('(prefers-reduced-motion: reduce)').matches, demChuyen=0, banSo=0;
const $=id=>document.getElementById(id);
const cat=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};
const gio=ts=>ts?new Date(ts).toLocaleTimeString('vi-VN',{hour12:false}):'';
const ttCua=e=>e.loai==='lenh'?'lenh':e.tt;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const khoa=e=>(e.ts||'')+'|'+(e.nhan||'').slice(0,40);
const mmss=s=>s==null||!isFinite(s)?'—':(s<0?'-':'')+Math.floor(Math.abs(s)/60)+':'+String(Math.floor(Math.abs(s)%60)).padStart(2,'0');
const lechTxt=s=>s==null||!isFinite(s)?'':(s>0?'+':s<0?'−':'±')+Math.abs(Math.round(s))+' s';
const so1=(v,le)=>v==null||!isFinite(v)?'—':v.toFixed(le);
function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return (h>>>0)/4294967295}
/* ghi DOM chỉ khi đổi (tránh tính lại bố cục mỗi khung) */
const DA={};function ghi(el,kieu,v){const k=(el.id||'')+kieu+(el.dataset.k||'');if(DA[k]===v)return;DA[k]=v;if(kieu==='h')el.innerHTML=v;else el.textContent=v}
/* kích thước canvas: đo bằng ResizeObserver, KHÔNG đọc getBoundingClientRect mỗi khung */
const KT=new Map(), DPR=()=>Math.min(2,devicePixelRatio||1);
const ro=new ResizeObserver(ds=>{for(const d of ds){const c=d.target,w=d.contentRect.width,h=d.contentRect.height,p=DPR();
  KT.set(c,[w,h]);c.width=Math.max(1,Math.round(w*p));c.height=Math.max(1,Math.round(h*p));c._ban=true}});
function kt(c){const v=KT.get(c);if(!v)return [0,0];c.getContext('2d').setTransform(DPR(),0,0,DPR(),0,0);return v}
/* bộ nhớ đo chữ cho nhãn */
const RONG=new Map();
if(document.fonts)document.fonts.ready.then(()=>{RONG.clear();gdBan=true});   // đo lại khi font web tải xong (thẻ mốc không cắt chữ)
function doRong(g,font,s){const k=font+'|'+s;let v=RONG.get(k);if(v==null){g.font=font;v=g.measureText(s).width;RONG.set(k,v);if(RONG.size>3000)RONG.clear()}return v}

/* =========================== GIẢN ĐỒ RANG: lớp tĩnh + lớp động =========================== */
const gd=$('gd'), gx=gd.getContext('2d'), lop=document.createElement('canvas'), lx=lop.getContext('2d');
ro.observe(gd);
const DUONG=[
  {k:'bt',ten:'BT hạt',mau:C.xanh,net:[],bat:true},{k:'et',ten:'ET khí',mau:C.do,net:[7,4],bat:true},
  {k:'bu',ten:'Buồng nhiệt',mau:C.vienDam,net:[],bat:true},{k:'ror',ten:'RoR BT',mau:C.chu,net:[8,3,2,3],bat:true},
  {k:'dich',ten:'Đường đích',mau:C.xanh,net:[2,5],bat:true},{k:'bao',ten:'Dự báo',mau:C.xanh,net:[4,4],bat:true},
  {k:'lan',ten:'Nhiệt · Gió',mau:C.do,net:[],bat:true}];
const bat=k=>DUONG.find(d=>d.k===k).bat;
let tro=null, HINH=null, gdBan=true;
$('chu_giai_gd').innerHTML=DUONG.map(d=>'<button class="cg" data-k="'+d.k+'" aria-pressed="true"><svg viewBox="0 0 22 8" aria-hidden="true"><line x1="1" y1="4" x2="21" y2="4" stroke="'+d.mau+
  '" stroke-width="2.4" stroke-dasharray="'+d.net.join(' ')+'"/></svg><span class="ten">'+d.ten+'</span></button>').join('');
$('chu_giai_gd').onclick=ev=>{const b=ev.target.closest('.cg');if(!b)return;const d=DUONG.find(x=>x.k===b.dataset.k);
  d.bat=!d.bat;b.classList.toggle('tat',!d.bat);b.setAttribute('aria-pressed',d.bat);gdBan=true};
let troCho=null;
gd.addEventListener('pointermove',ev=>{troCho=[ev.offsetX,ev.offsetY]},{passive:true});
gd.addEventListener('pointerleave',()=>{troCho=null;tro=null});

/* dải RoR đích giai đoạn phát triển: theo đề của mẻ — mẻ cũ chưa ghi thì 5–7 */
const daiRoR=d=>[d&&isFinite(d.ror_lo)?+d.ror_lo:5,d&&isFinite(d.ror_hi)?+d.ror_hi:7];
function dungLopGd(){ // vẽ phần KHÔNG đổi giữa hai lần lấy số
  const [w,h]=KT.get(gd)||[0,0]; if(!w)return; const p=DPR();
  if(lop.width!==gd.width||lop.height!==gd.height){lop.width=gd.width;lop.height=gd.height}   // cấp lại bộ nhớ chỉ khi đổi cỡ
  const g=lx;g.setTransform(p,0,0,p,0,0);g.clearRect(0,0,w,h);
  const m=S&&S.me, mocA=(m&&m.moc&&m.moc.moc_giay)||{};
  const L=((m&&m.log)||[]).filter(r=>mocA.DROP==null||r[0]<=mocA.DROP+20);
  HINH=null;
  if(L.length<2){g.fillStyle=C.mo;g.font='14px '+FONT;g.textAlign='center';
    if(w<620){g.fillText('Chưa có số mẻ',w/2,h/2-10);g.fillText('Hồng bắt đầu mẻ thì giản đồ hiện ở đây',w/2,h/2+12)}
    else g.fillText('Chưa có số mẻ — Hồng bắt đầu mẻ thì giản đồ hiện ở đây',w/2,h/2);return}
  const moc=mocA, mbt=(m.moc&&m.moc.moc_bt)||{}, dich=(m.moc&&m.moc.dich)||{};
  const tCuoi=L[L.length-1][0], t0=Math.min(0,L[0][0]), t1=Math.max((dich.drop||840)+90,tCuoi+75,moc.DROP?moc.DROP+60:0);
  const nho=w<620, PL=nho?40:52, PR=nho?38:54, PT=58, LAN=bat('lan')?(h<420?56:76):0, PB=26+LAN, H=h-PT-PB;
  const X=s=>PL+(s-t0)*(w-PL-PR)/(t1-t0), Y=v=>PT+H-(v-40)*H/210, YR=v=>PT+H-(v+5)*H/40;
  HINH={X,Y,YR,PL,PR,PT,H,LAN,w,h,t0,t1,L,moc,dich};
  [[0,moc.DE,C.xanhNhat,'SẤY'],[moc.DE,moc.FCs,C.nauNhat,'MAILLARD'],[moc.FCs,moc.DROP,C.doNhat,'PHÁT TRIỂN']].forEach(([a,b,mau,ten])=>{
