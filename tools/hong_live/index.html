<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hồng Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Bộ áo OTL V7 (xám đá + đỏ, xanh dương ít) · kiểu HUD/FUI phẳng: nét mảnh 1 px, dấu ngoặc kỹ thuật, số đơn cách.
   Luật chủ máy: không bóng, không quầng, không gradient, không đen, không vạch màu ở mép ô. */
:root{
  --nen:#E7E5E4; --mat:#F5F5F4; --the:#FFFFFF; --vien:#D6D3D1; --vien-dam:#A8A29E;
  --chu:#44403C; --mo:#78716C; --do:#B91C1C; --do-nhat:#FEE2E2; --nau:#8D5524; --nau-nhat:#F3E8DC;
  --xanh:#1565C0; --xanh-nhat:#E2ECF7; --ho:#B45309; --ho-nhat:#FEF3C7;
  --so:"Fira Code",Consolas,monospace; --nhanh:160ms; --vua:240ms; --em:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--nen);color:var(--chu);font:14px/1.45 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif;overflow:hidden}
.trang{display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh;gap:10px;padding:10px}
/* ---- thanh trên ---- */
.tren{display:grid;grid-template-columns:auto auto minmax(260px,1fr) auto;gap:16px;align-items:center;background:var(--the);border-radius:12px;padding:10px 14px}
.hieu{display:flex;flex-direction:column}
.hieu b{font-size:17px;font-weight:700;letter-spacing:.2px}
.hieu span{font-size:11.5px;color:var(--mo);font-family:var(--so)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.6px;padding:5px 10px;border-radius:6px;background:var(--mat);color:var(--mo);white-space:nowrap}
.chip.lam{background:var(--do);color:#fff}
.chip.ho{background:var(--ho-nhat);color:var(--ho)}
.chip.xanh{background:var(--xanh);color:#fff}
.tam_giac{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid currentColor}
.viec{font-size:12.5px;color:var(--mo);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:360px}
.viec b{color:var(--chu);font-weight:600}
#ray{width:100%;height:46px;display:block}
.gio{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.gio .dh{font-family:var(--so);font-size:20px;font-weight:600;letter-spacing:.5px}
.gio .dem{font-family:var(--so);font-size:11px;color:var(--mo)}
/* ---- lưới chính ---- */
.luoi{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:10px;min-height:0}
.cot{display:flex;flex-direction:column;gap:10px;min-height:0}
.o{background:var(--the);border-radius:12px;position:relative;min-height:0}
.o .dau{display:flex;align-items:center;gap:10px;padding:10px 14px 0;flex-wrap:wrap}
.o .dau h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.o .dau .phu{font-size:12px;color:var(--mo);font-family:var(--so)}
/* dấu ngoặc kỹ thuật ở 4 góc khung (HUD) — nét mảnh, KHÔNG phải vạch màu ở mép */
.ngoac::before,.ngoac::after{content:"";position:absolute;width:14px;height:14px;border:1.5px solid var(--vien-dam);pointer-events:none}
.ngoac::before{left:6px;top:6px;border-right:0;border-bottom:0}
.ngoac::after{right:6px;bottom:6px;border-left:0;border-top:0}
.gd{flex:1;display:flex;flex-direction:column}
#gd{flex:1;width:100%;min-height:0;display:block;cursor:crosshair}
.chu_giai_gd{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.cg{font:inherit;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;padding:4px 9px;min-height:30px;border-radius:6px;border:1px solid var(--vien);background:var(--mat);color:var(--chu);cursor:pointer;transition:background var(--nhanh),opacity var(--nhanh),transform var(--nhanh) var(--em)}
.cg:hover{background:var(--the)}.cg:active{transform:scale(.96)}
.cg.tat{opacity:.45;text-decoration:line-through}
.cg:focus-visible,.nut:focus-visible,.tab button:focus-visible{outline:3px solid var(--xanh);outline-offset:2px}
.cg svg{width:22px;height:8px}
/* thông số */
.so{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--nen);border-radius:12px;overflow:hidden}
.tl{background:var(--the);padding:8px 10px 6px;min-width:0;position:relative}
.tl .t{font-size:10.5px;font-weight:700;color:var(--mo);letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .g{font-family:var(--so);font-size:22px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl .g small{font-size:12px;color:var(--mo);margin-left:2px;font-weight:500}
.tl .p{font-size:11px;color:var(--mo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
.tl canvas{width:100%;height:22px;display:block;margin-top:2px}
.tl.chinh .g{font-size:30px;color:var(--xanh)}
.tu{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.4px;padding:0 5px;border-radius:4px;margin-left:4px;vertical-align:2px}
.pha_bar{grid-column:1/-1;background:var(--the);padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.pha_bar .t{font-size:10.5px;font-weight:700;color:var(--mo);letter-spacing:.5px;text-transform:uppercase}
.vach{display:flex;height:24px;border-radius:6px;overflow:hidden;background:var(--mat);font-size:11px;font-weight:600}
.vach div{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;transition:flex-grow var(--vua) var(--em)}
/* sơ đồ */
.sd{flex:1;min-height:260px}
#so_do{width:100%;height:100%;display:block;touch-action:none;border-radius:12px}
.noi{position:absolute;background:rgba(255,255,255,.94);border:1px solid var(--vien);border-radius:10px;padding:8px 10px;font-size:12px}
.cg_sd{left:12px;top:12px}
.cg_sd div{display:flex;align-items:center;gap:7px;margin:2px 0}
.cg_sd i{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.dieu{right:12px;top:12px;display:flex;gap:6px;padding:5px}
.nut{font:inherit;font-size:12px;font-weight:600;padding:6px 10px;min-height:32px;border-radius:7px;border:1px solid var(--vien-dam);background:var(--mat);color:var(--chu);cursor:pointer;transition:background var(--nhanh),transform var(--nhanh) var(--em)}
.nut:hover{background:var(--the)}.nut:active{transform:scale(.96)}
.nut.on{background:var(--chu);border-color:var(--chu);color:#fff}
#chi_tiet{left:12px;bottom:12px;right:12px;max-height:46%;overflow:auto;display:none}
#chi_tiet pre{white-space:pre-wrap;word-break:break-word;margin:6px 0 0;font:12px/1.45 var(--so);background:var(--mat);border-radius:6px;padding:8px}
#chi_tiet .x{float:right;cursor:pointer;color:var(--mo);font-weight:700;padding:0 6px}
/* nhật ký */
.vl{height:34%;min-height:180px;display:flex;flex-direction:column}
.tab{display:flex;gap:6px;padding:10px 12px 6px}
.tab button{font:inherit;font-size:12px;font-weight:600;padding:5px 11px;min-height:32px;border-radius:7px;border:1px solid var(--vien-dam);background:var(--mat);color:var(--chu);cursor:pointer}
.tab button.on{background:var(--chu);border-color:var(--chu);color:#fff}
.dong{flex:1;overflow:auto;padding:0 12px 10px;min-height:0}
.sk{padding:7px 0;border-bottom:1px solid var(--nen);font-size:12.5px;cursor:pointer}
.sk.moi{animation:vao var(--vua) var(--em) both}
@keyframes vao{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.sk .gi{color:var(--mo);font-family:var(--so);font-size:11.5px;margin-right:6px}
.sk .n{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-right:6px;letter-spacing:.4px}
.sk pre{white-space:pre-wrap;word-break:break-word;margin:6px 0 0;background:var(--mat);border-radius:6px;padding:8px;font:12px/1.45 var(--so);display:none;max-height:240px;overflow:auto}
.sk.mo pre{display:block}
.trong{color:var(--mo);padding:20px 4px;text-align:center}
@media (max-width:1180px){body{overflow:auto}.trang{height:auto}.luoi{grid-template-columns:1fr}.gd{min-height:460px}.sd{min-height:420px}
  .so{grid-template-columns:repeat(3,minmax(0,1fr))}.tren{grid-template-columns:1fr auto}#ray{grid-column:1/-1}.viec{display:none}}
@media (max-height:820px) and (min-width:1181px){ /* màn thấp (Chrome nửa màn): nhường chỗ cho giản đồ */
  .tl canvas{display:none}.tl .g{font-size:19px}.tl.chinh .g{font-size:24px}.tl{padding:6px 10px 4px}
  .cg_sd{display:none}.vl{height:30%}.pha_bar{padding:5px 10px}.vach{height:20px}}
@media (prefers-reduced-motion:reduce){.sk.moi{animation:none}}
</style>
</head>
<body>
<div class="trang">
  <header class="tren">
    <div class="hieu"><b>OTL Hồng · Live</b><span id="thu_muc">—</span></div>
    <div style="display:flex;flex-direction:column;gap:4px"><span class="chip" id="chip_tt">ĐANG NỐI</span><span class="viec" id="viec">—</span></div>
    <canvas id="ray" aria-label="Tiến trình mẻ: mốc thật và đích"></canvas>
    <div class="gio"><span class="dh" id="dong_ho">--:--</span><span id="chip_cu"></span><span class="dem" id="dem">—</span></div>
  </header>
  <div class="luoi">
    <div class="cot">
      <section class="o ngoac gd" aria-label="Giản đồ rang">
        <div class="dau"><h2>Giản đồ rang</h2><span class="phu" id="gd_phu">—</span>
          <div class="chu_giai_gd" id="chu_giai_gd"></div></div>
        <canvas id="gd"></canvas>
      </section>
      <section class="so" id="so" aria-label="Thông số máy"></section>
    </div>
    <div class="cot">
      <section class="o ngoac sd" aria-label="Sơ đồ việc Hồng đang làm">
        <canvas id="so_do"></canvas>
        <div class="noi cg_sd">
          <div><i style="background:var(--do)"></i>ĐANG LÀM</div>
          <div><i style="background:var(--nau)"></i>CÂN NHẮC</div>
          <div><i style="background:var(--mat);border:2px solid var(--vien-dam)"></i>XONG</div>
          <div><span class="tam_giac" style="color:var(--ho)"></span>LỖI · nháy tới khi xem</div>
          <div><i style="background:var(--xanh)"></i>LỆNH ANH</div>
        </div>
        <div class="noi dieu"><button class="nut on" id="b_chuyen" aria-pressed="true">Chuyển động: BẬT</button><button class="nut" id="b_ve">Xáo lại</button></div>
        <div class="noi" id="chi_tiet" role="dialog" aria-live="polite"></div>
      </section>
      <section class="o vl" aria-label="Nhật ký">
        <div class="tab" role="tablist"><button class="on" data-t="sk" role="tab">Việc Hồng làm</button><button data-t="me" role="tab">Nhật ký mẻ</button></div>
        <div class="dong" id="dong"></div>
      </section>
    </div>
  </div>
</div>
<script>
"use strict";
const C={nen:'#E7E5E4',mat:'#F5F5F4',the:'#FFFFFF',vien:'#D6D3D1',vienDam:'#A8A29E',chu:'#44403C',mo:'#78716C',
  do:'#B91C1C',doNhat:'#FEE2E2',nau:'#8D5524',nauNhat:'#F3E8DC',xanh:'#1565C0',xanhNhat:'#E2ECF7',ho:'#B45309'};
const FONT='"Be Vietnam Pro",Segoe UI', SO='"Fira Code",Consolas,monospace';
const KIEU={dang_lam:{nen:C.do,vien:C.do,ten:'ĐANG LÀM'},can_nhac:{nen:C.nau,vien:C.nau,ten:'CÂN NHẮC'},
  xong:{nen:C.mat,vien:C.vienDam,ten:'XONG'},loi:{nen:C.ho,vien:C.ho,ten:'LỖI'},lenh:{nen:C.xanh,vien:C.xanh,ten:'LỆNH ANH'}};
const NHOM=[['lenh','Lệnh anh'],['nghi','Hồng nghĩ'],['doc','Đọc máy'],['mpc','Dự báo · MPC'],['hmi','Thao tác HMI'],
            ['artisan','Artisan'],['phantich','Phân tích'],['nho','Ghi nhớ · Git'],['tra','Tra cứu · Code']];
const MOI_NHOM=5, HAT_CANH=4, SO_VE_TINH=[10,18], SO_BUI=90;
let S=null, tab='sk', chuyen=!matchMedia('(prefers-reduced-motion: reduce)').matches, demChuyen=0;
const $=id=>document.getElementById(id);
const cat=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};
const gio=ts=>ts?new Date(ts).toLocaleTimeString('vi-VN',{hour12:false}):'';
const ttCua=e=>e.loai==='lenh'?'lenh':e.tt;
const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const khoa=e=>(e.ts||'')+'|'+(e.nhan||'').slice(0,40);
const mmss=s=>s==null||!isFinite(s)?'—':(s<0?'-':'')+Math.floor(Math.abs(s)/60)+':'+String(Math.floor(Math.abs(s)%60)).padStart(2,'0');
const lechTxt=s=>s==null||!isFinite(s)?'':(s>0?'+':s<0?'−':'±')+Math.abs(Math.round(s))+' s';
function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return (h>>>0)/4294967295}
function coDan(c){const r=c.getBoundingClientRect(),p=devicePixelRatio||1;
  if(c.width!==Math.round(r.width*p)||c.height!==Math.round(r.height*p)){c.width=Math.round(r.width*p);c.height=Math.round(r.height*p)}
  c.getContext('2d').setTransform(p,0,0,p,0,0);return [r.width,r.height]}

/* =========================== GIẢN ĐỒ RANG =========================== */
const gd=$('gd'), gx=gd.getContext('2d');
const DUONG=[ // khoá, tên, màu, nét, bật
  {k:'bt',ten:'BT hạt',mau:C.xanh,net:[],rong:2.6,bat:true},
  {k:'et',ten:'ET khí',mau:C.do,net:[7,4],rong:2,bat:true},
  {k:'bu',ten:'Buồng VX4',mau:C.vienDam,net:[],rong:1.3,bat:true},
  {k:'ror',ten:'RoR BT',mau:C.chu,net:[8,3,2,3],rong:1.6,bat:true},
  {k:'dich',ten:'Đích MPC',mau:C.xanh,net:[2,5],rong:1.6,bat:true},
  {k:'bao',ten:'Dự báo',mau:C.xanh,net:[4,4],rong:1.6,bat:true},
  {k:'lan',ten:'Nhiệt · Gió',mau:C.do,net:[],rong:1.6,bat:true}];
const bat=k=>DUONG.find(d=>d.k===k).bat;
let tro=null;   // con trỏ trên giản đồ
(function dungChuGiai(){
  $('chu_giai_gd').innerHTML=DUONG.map(d=>'<button class="cg" data-k="'+d.k+'" aria-pressed="true"><svg viewBox="0 0 22 8"><line x1="1" y1="4" x2="21" y2="4" stroke="'+d.mau+
    '" stroke-width="2.4" stroke-dasharray="'+d.net.join(' ')+'"/></svg>'+d.ten+'</button>').join('');
  $('chu_giai_gd').onclick=ev=>{const b=ev.target.closest('.cg');if(!b)return;const d=DUONG.find(x=>x.k===b.dataset.k);
    d.bat=!d.bat;b.classList.toggle('tat',!d.bat);b.setAttribute('aria-pressed',d.bat)};
})();
gd.addEventListener('pointermove',ev=>{const r=gd.getBoundingClientRect();tro={x:ev.clientX-r.left,y:ev.clientY-r.top}});
gd.addEventListener('pointerleave',()=>tro=null);

function veGianDo(t){
  const [w,h]=coDan(gd); gx.clearRect(0,0,w,h);
  const m=S&&S.me, mocX=(m&&m.moc&&m.moc.moc_giay)||{};
  const L=((m&&m.log)||[]).filter(r=>mocX.DROP==null||r[0]<=mocX.DROP+20);   // sau xả 20 s thì thôi vẽ (làm nguội không thuộc giản đồ)
  if(L.length<2){gx.fillStyle=C.mo;gx.font='13px '+FONT;gx.textAlign='center';
    gx.fillText('Chưa có số mẻ — Hồng bắt đầu mẻ thì giản đồ hiện ở đây',w/2,h/2);return}
  const moc=(m.moc&&m.moc.moc_giay)||{}, mbt=(m.moc&&m.moc.moc_bt)||{}, dich=(m.moc&&m.moc.dich)||{};
  const tCuoi=L[L.length-1][0], t0=Math.min(0,L[0][0]), t1=Math.max((dich.drop||840)+90,tCuoi+75,moc.DROP?moc.DROP+60:0);
  const PL=50,PR=52,PT=34,LAN=bat('lan')?74:0,PB=24+LAN, H=h-PT-PB;
  const X=s=>PL+(s-t0)*(w-PL-PR)/(t1-t0), Y=v=>PT+H-(v-40)*H/(250-40), YR=v=>PT+H-(v+5)*H/40;
  // dải giai đoạn (nền phẳng nhạt)
  const pha=[[0,moc.DE,C.xanhNhat,'SẤY'],[moc.DE,moc.FCs,C.nauNhat,'MAILLARD'],[moc.FCs,moc.DROP,C.doNhat,'PHÁT TRIỂN']];
  pha.forEach(([a,b,mau,ten])=>{if(a==null)return;const bb=b!=null?b:tCuoi;if(bb<=a)return;
    gx.fillStyle=mau;gx.globalAlpha=.7;gx.fillRect(X(a),PT,X(bb)-X(a),H);gx.globalAlpha=1;
    gx.fillStyle=C.mo;gx.font='700 10px '+FONT;gx.textAlign='left';gx.fillText(ten,X(a)+6,PT+13)});
  // lưới + trục
  gx.lineWidth=1;gx.font='11px '+SO;
  for(let v=40;v<=250;v+=20){const y=Y(v);gx.strokeStyle=v%100===0?C.vien:'#ECEAE8';gx.beginPath();gx.moveTo(PL,y);gx.lineTo(w-PR,y);gx.stroke();
    gx.fillStyle=C.mo;gx.textAlign='right';gx.fillText(v,PL-6,y+4)}
  for(let v=0;v<=30;v+=5){gx.textAlign='left';gx.fillStyle=C.mo;gx.fillText(v,w-PR+6,YR(v)+4)}
  gx.save();gx.translate(12,PT+H/2);gx.rotate(-Math.PI/2);gx.textAlign='center';gx.fillText('°C',0,0);gx.restore();
  gx.save();gx.translate(w-10,PT+H/2);gx.rotate(Math.PI/2);gx.textAlign='center';gx.fillText('RoR °C/ph',0,0);gx.restore();
  const buoc=t1-t0>1200?120:60;
  for(let s=Math.ceil(t0/buoc)*buoc;s<=t1;s+=buoc){const x=X(s);gx.strokeStyle='#ECEAE8';gx.beginPath();gx.moveTo(x,PT);gx.lineTo(x,PT+H);gx.stroke();
    gx.fillStyle=C.mo;gx.textAlign='center';gx.fillText(mmss(s),x,PT+H+16)}
  // dải RoR đích 5–7 trong phát triển (dải bình thường — Hollifield embedded-trends)
  if(bat('ror')&&moc.FCs!=null){const a=X(moc.FCs),b=X(moc.DROP!=null?moc.DROP:t1);
    gx.fillStyle=C.do;gx.globalAlpha=.12;gx.fillRect(a,YR(7),b-a,YR(5)-YR(7));gx.globalAlpha=1;
    gx.setLineDash([3,3]);gx.strokeStyle=C.do;gx.beginPath();gx.moveTo(a,YR(7));gx.lineTo(b,YR(7));gx.moveTo(a,YR(5));gx.lineTo(b,YR(5));gx.stroke();gx.setLineDash([]);
    gx.fillStyle=C.do;gx.font='600 10.5px '+FONT;gx.textAlign='right';gx.fillText('RoR đích 5–7',b-4,YR(7)-4)}
  // đích thời gian (nét đứt) + mốc thật (nét liền + cờ)
  [['DE',dich.de],['FCs',dich.fcs],['DROP',dich.drop]].forEach(([ten,s])=>{if(s==null)return;const x=X(s);
    gx.setLineDash([4,4]);gx.strokeStyle=C.vienDam;gx.beginPath();gx.moveTo(x,PT);gx.lineTo(x,PT+H);gx.stroke();gx.setLineDash([]);
    gx.fillStyle=C.mo;gx.font='10.5px '+FONT;gx.textAlign='center';gx.fillText('đích '+ten+' '+mmss(s),x,PT+H-6)});
  const MOCS=['CHARGE','TP','DE','FCs','DROP'], dichCua={DE:dich.de,FCs:dich.fcs,DROP:dich.drop};
  let coTruoc=-1e9;
  MOCS.forEach((ten,i)=>{const s=moc[ten];if(s==null)return;const x=X(s);
    gx.strokeStyle=C.chu;gx.globalAlpha=.55;gx.beginPath();gx.moveTo(x,PT);gx.lineTo(x,PT+H);gx.stroke();gx.globalAlpha=1;

    for(const m of ds){if(m===n)continue;const dx=n.x-m.x,dy=n.y-m.y,d=Math.hypot(dx,dy),toi=(n.r||8)+(m.r||8)+14;
      if(d<toi&&d>.01){const f=(toi-d)*60/d;fx+=dx*f;fy+=dy*f}}
    const le=(n.r||10)+24;if(n.x<le)fx+=(le-n.x)*90;if(n.x>w-le)fx-=(n.x-w+le)*90;if(n.y<le)fy+=(le-n.y)*90;if(n.y>h-le)fy-=(n.y-h+le)*90;
    n.vx=(n.vx+fx*dt)*Math.pow(0.0009,dt);n.vy=(n.vy+fy*dt)*Math.pow(0.0009,dt);n.x+=n.vx*dt;n.y+=n.vy*dt;
    n.co+=((n.mat?0:1)-n.co)*Math.min(1,dt*(n.mat?9:6));
    n.phong=(n.phong||1)+(((chon===n||n.lo)?1.18:1)-(n.phong||1))*Math.min(1,dt*12);
  }
  for(const [k,n] of N)if(n.mat&&n.co<.02)N.delete(k);
}
function nhan(s,x,y,dam){cx.font=(dam?'600 12.5px ':'500 11.5px ')+FONT;cx.textAlign='center';
  const w=cx.measureText(s).width+12;cx.fillStyle='rgba(255,255,255,.93)';cx.strokeStyle=C.vien;cx.lineWidth=1;
  cx.beginPath();cx.roundRect(x-w/2,y-13,w,19,6);cx.fill();cx.stroke();cx.fillStyle=C.chu;cx.fillText(s,x,y+1)}
function veSoDo(t,dt){
  vatLy(t,dt);
  const [w,h]=coDan(cv);cx.clearRect(0,0,w,h);
  // bụi trôi nền
  for(const b of BUI){if(chuyen){b.x=(b.x+Math.cos(b.a)*b.v*dt+1)%1;b.y=(b.y+Math.sin(b.a)*b.v*dt+1)%1;b.a+=dt*0.2*Math.sin(t/4000+b.r)}
    cx.fillStyle=C.vien;cx.beginPath();cx.arc(b.x*w,b.y*h,b.r,0,6.283);cx.fill();demChuyen++}
  const ds=[...N.values()], tam=N.get('tam');
  // radar quanh Hồng: vòng tròn mảnh + cung quét + vệ tinh
  if(tam){const R0=(tam.r||30)*tam.co, quay=chuyen?t/(tam.tt==='dang_lam'?900:2600):0;
    cx.strokeStyle=C.vien;cx.lineWidth=1;[1.9,2.7,3.6].forEach(k=>{cx.beginPath();cx.arc(tam.x,tam.y,R0*k,0,6.283);cx.stroke()});
    cx.strokeStyle=tam.tt==='dang_lam'?C.do:C.vienDam;cx.lineWidth=2;
    for(let i=0;i<3;i++){cx.beginPath();cx.arc(tam.x,tam.y,R0*2.7,quay+i*2.094,quay+i*2.094+0.7);cx.stroke()}
    cx.lineWidth=1.4;for(let i=0;i<4;i++){cx.beginPath();cx.arc(tam.x,tam.y,R0*3.6,-quay*0.6+i*1.571,-quay*0.6+i*1.571+0.35);cx.stroke()}
    SO_VE_TINH.forEach((so,vi)=>{const rr=R0*(vi?1.9:1.45);for(let i=0;i<so;i++){const a=(vi?-1:1)*quay*(vi?0.7:1.3)+i*6.283/so;
      cx.fillStyle=vi?C.vienDam:(tam.tt==='dang_lam'?C.do:C.mo);cx.beginPath();cx.arc(tam.x+rr*Math.cos(a),tam.y+rr*Math.sin(a),vi?1.8:2.6,0,6.283);cx.fill();demChuyen++}})}
  // cạnh + hạt
  for(const n of ds){const p=n.cha&&N.get(n.cha);if(!p)continue;
    const k=KIEU[n.tt]||KIEU.xong,mx=(p.x+n.x)/2,my=(p.y+n.y)/2,dx=n.x-p.x,dy=n.y-p.y,L=Math.hypot(dx,dy)||1;
    const uon=chuyen?Math.sin(t/1300+n.pha)*L*.08:0,qx=mx-dy/L*uon,qy=my+dx/L*uon;
    cx.save();cx.globalAlpha=.9*n.co;cx.strokeStyle=n.tt==='xong'?C.vienDam:k.vien;cx.lineWidth=n.tt==='dang_lam'?2.4:(n.cap===1?1.8:1.2);
    if(n.tt==='dang_lam'||n.tt==='can_nhac'){cx.setLineDash([7,6]);cx.lineDashOffset=chuyen?-t/30:0}
    cx.beginPath();cx.moveTo(p.x,p.y);cx.quadraticCurveTo(qx,qy,n.x,n.y);cx.stroke();cx.restore();
    if(!chuyen)continue;
    const toc={dang_lam:.9,lenh:.55,can_nhac:.4,loi:.7,xong:.16}[n.tt]||.2, vao=n.tt==='lenh';
    for(const ph of n.hat){let u=(t/1000*toc+ph)%1;if(n.tt==='loi')u=.5+.5*Math.sin(t/400+ph*6.283);if(vao)u=1-u;
      const a=1-u,x=a*a*p.x+2*a*u*qx+u*u*n.x,y=a*a*p.y+2*a*u*qy+u*u*n.y;
      cx.globalAlpha=n.co*(n.tt==='xong'?.55:.95)*Math.sin(Math.PI*Math.min(1,Math.max(0,u)));
      cx.fillStyle=n.tt==='xong'?C.mo:k.vien;cx.beginPath();cx.arc(x,y,n.tt==='dang_lam'?3.2:2.3,0,6.283);cx.fill();demChuyen++}
    cx.globalAlpha=1}
  for(let i=SONG.length-1;i>=0;i--){const s=SONG[i],u=(t-s.t0)/900;if(u>=1){SONG.splice(i,1);continue}
    cx.save();cx.globalAlpha=(1-u)*.8;cx.strokeStyle=s.mau;cx.lineWidth=2.5*(1-u)+.5;cx.beginPath();cx.arc(s.x,s.y,s.r0+u*46,0,6.283);cx.stroke();cx.restore();demChuyen++}
  for(const n of ds.sort((a,b)=>b.cap-a.cap)){
    const k=KIEU[n.tt]||KIEU.xong;let r=(n.r||10)*n.co*(n.phong||1);
    if(chuyen&&n.tt==='dang_lam')r*=1+.1*Math.sin(t/170+n.pha);if(chuyen&&n.cap===0)r*=1+.03*Math.sin(t/900);
    if(r<.5)continue;demChuyen++;
    const nhay=n.tt==='loi'&&!daXem.has(n.k)&&Math.floor(t/500)%2===0;
    cx.save();cx.globalAlpha=n.trong?.35:1;
    if(n.cap===0){cx.beginPath();cx.arc(n.x,n.y,r,0,6.283);cx.fillStyle=n.tt==='dang_lam'?C.do:C.the;cx.fill();cx.lineWidth=3;cx.strokeStyle=C.do;cx.stroke();
      cx.fillStyle=n.tt==='dang_lam'?'#fff':C.do;cx.font='700 18px '+FONT;cx.textAlign='center';cx.fillText('Hồng',n.x,n.y+3);
      cx.font='600 10.5px '+FONT;cx.fillText(n.tt==='dang_lam'?'ĐANG LÀM':'RẢNH',n.x,n.y+18);cx.restore();continue}
    if(n.tt==='loi'){cx.beginPath();cx.moveTo(n.x,n.y-r*1.25);cx.lineTo(n.x+r*1.15,n.y+r*.8);cx.lineTo(n.x-r*1.15,n.y+r*.8);cx.closePath();
      cx.fillStyle=nhay?C.the:k.nen;cx.fill();cx.lineWidth=2.5;cx.strokeStyle=k.vien;cx.stroke()}
    else{cx.beginPath();cx.arc(n.x,n.y,r,0,6.283);cx.fillStyle=n.cap===1?C.the:k.nen;cx.fill();cx.lineWidth=n.cap===1?3:2;cx.strokeStyle=k.vien;cx.stroke();
      if(n.cap===1&&!n.trong){cx.fillStyle=n.tt==='xong'?C.chu:k.vien;cx.font='700 '+Math.round(r*.7)+'px '+FONT;cx.textAlign='center';cx.fillText(n.so,n.x,n.y+r*.25)}}
    if(chon===n){cx.setLineDash([3,4]);cx.lineWidth=1.5;cx.strokeStyle=C.chu;cx.beginPath();cx.arc(n.x,n.y,r+9,0,6.283);cx.stroke();cx.setLineDash([])}
    cx.restore();
    if(!(n.cap===1||n.moi||n===chon||n.lo)||n.co<.6)continue;
    nhan(n.ten,n.x,n.y+r+(n.cap===1?17:15),n.cap===1);
    if(!n.trong){cx.font='700 10px '+FONT;cx.textAlign='center';cx.fillStyle=n.tt==='xong'?C.mo:k.vien;cx.fillText(k.ten,n.x,n.y-r-(n.tt==='loi'?12:8))}
  }
}

/* =========================== NHẬT KÝ + LẤY SỐ =========================== */
function hienDong(){const el=$('dong');if(!S)return;
  if(tab==='me'){const m=S.me||{},d=(m.dong||[]).slice().reverse();
    el.innerHTML=d.length?d.map(x=>'<div class="sk">'+esc(x)+'</div>').join(''):'<div class="trong">Chưa có nhật ký mẻ.</div>';return}
  const ev=(S.hong.su_kien||[]).slice().reverse(),cu=new Set([...el.querySelectorAll('.sk')].map(x=>x.dataset.k));
  if(!ev.length){el.innerHTML='<div class="trong">Chưa thấy Hồng làm việc. Gọi Hồng là sơ đồ sáng lên.</div>';return}
  el.innerHTML=ev.map((e,i)=>{const t=ttCua(e),k=KIEU[t]||KIEU.xong,kk=khoa(e),moi=cu.size&&!cu.has(kk);
    return '<div class="sk'+(moi?' moi':'')+'" data-k="'+esc(kk)+'" style="animation-delay:'+(i*40)+'ms"><span class="gi">'+gio(e.ts)+'</span><span class="n" style="background:'+
      (t==='xong'?C.nen:k.nen)+';color:'+(t==='xong'?C.chu:'#fff')+'">'+k.ten+'</span>'+esc(e.nhan)+'<pre>'+esc((e.chi_tiet||'')+(e.kq?'\n\n→ '+e.kq:''))+'</pre></div>'}).join('')}
async function lay(){const chip=$('chip_tt');
  try{const r=await fetch('/api/state',{cache:'no-store'}),s=await r.json();if(s.loi)throw new Error(s.loi);
    s._dau=S?S._dau:false;S=s;
    const dang=(S.hong.su_kien||[]).some(e=>e.tt==='dang_lam');chip.className='chip'+(dang?' lam':'');chip.textContent=dang?'HỒNG ĐANG LÀM':'HỒNG RẢNH';
    $('viec').innerHTML='<b>'+esc(S.hong.trang_thai)+'</b>';$('dong_ho').textContent=S.gio;
    const m=S.me||{};$('thu_muc').textContent=m.thu_muc||'—';
    const moc=(m.moc&&m.moc.moc_giay)||{},c=m.cuoi||{};
    $('gd_phu').textContent=(moc.DROP?'đã xả · ':c.t!=null?'giờ rang '+mmss(c.t)+' · ':'chờ charge · ')+(m.log?m.log.length:0)+' điểm 1 Hz';
    const cu=m.tuoi_log_s;$('chip_cu').innerHTML=cu!=null&&cu>10?'<span class="chip ho"><span class="tam_giac"></span>SỐ CŨ · '+(cu<120?cu+' s':Math.round(cu/60)+' phút')+'</span>':'<span class="chip xanh">SỐ SỐNG</span>';
    capNhatSo();capNhatNut();if($('dong').scrollTop<5)hienDong();
  }catch(e){chip.className='chip ho';chip.innerHTML='<span class="tam_giac"></span>MẤT NỐI';$('viec').textContent='Không đọc được server: '+e.message}}

/* =========================== TƯƠNG TÁC + VÒNG VẼ =========================== */
function nutTai(x,y){let tot=null,d0=1e9;for(const n of N.values()){const d=Math.hypot(n.x-x,n.y-y);if(d<(n.r||10)+10&&d<d0){tot=n;d0=d}}return tot}
function toaDo(ev){const r=cv.getBoundingClientRect();return [ev.clientX-r.left,ev.clientY-r.top]}
cv.addEventListener('pointermove',ev=>{const [x,y]=toaDo(ev);chuot={x,y,trong:true};const n=nutTai(x,y);for(const m of N.values())m.lo=(m===n);cv.style.cursor=keo?'grabbing':(n?'pointer':'default')});
cv.addEventListener('pointerleave',()=>{chuot.trong=false;for(const m of N.values())m.lo=false});
cv.addEventListener('pointerdown',ev=>{const [x,y]=toaDo(ev);const n=nutTai(x,y);if(n&&n.cap>0){keo=n;cv.setPointerCapture(ev.pointerId)}chon=n||null;hienChiTiet()});
cv.addEventListener('pointerup',()=>{if(keo){keo.vx=(Math.random()-.5)*600;keo.vy=(Math.random()-.5)*600}keo=null});
function hienChiTiet(){const box=$('chi_tiet');if(!chon||!chon.e){box.style.display='none';return}
  const e=chon.e,t=ttCua(e),k=KIEU[t]||KIEU.xong;if(t==='loi')daXem.add(chon.k);box.style.display='block';
  box.innerHTML='<span class="x" id="x_dong" role="button" aria-label="Đóng">✕</span><b>'+gio(e.ts)+' · '+k.ten+'</b> — '+esc(e.nhan)+'<pre>'+esc((e.chi_tiet||'')+(e.kq?'\n\n→ '+e.kq:''))+'</pre>';
  $('x_dong').onclick=()=>{chon=null;box.style.display='none'}}
$('b_chuyen').onclick=e=>{chuyen=!chuyen;e.target.classList.toggle('on',chuyen);e.target.setAttribute('aria-pressed',chuyen);e.target.textContent='Chuyển động: '+(chuyen?'BẬT':'TẮT')};
$('b_ve').onclick=()=>{for(const n of N.values()){n.vx=(Math.random()-.5)*900;n.vy=(Math.random()-.5)*900}};
document.querySelectorAll('.tab button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab button').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.t;hienDong()});
$('dong').onclick=ev=>{const s=ev.target.closest('.sk');if(s)s.classList.toggle('mo')};
addEventListener('resize',capNhatNut);
let khungGd=0;
function vong(t){const dt=Math.min(.05,(t-(tLan||t))/1000)||.016;tLan=t;demChuyen=0;
  veSoDo(t,dt);
  if(S){if(++khungGd%2===0)veGianDo(t);veRay(t);if(khungGd%6===0)veDuongNho(t)}
  if(khungGd%30===0&&S)$('dem').textContent=chuyen?demChuyen+' phần tử đang chuyển động':'chuyển động đã tắt';
  requestAnimationFrame(vong)}
lay();setInterval(lay,1500);setInterval(nhipSo,50);requestAnimationFrame(vong);
</script>
