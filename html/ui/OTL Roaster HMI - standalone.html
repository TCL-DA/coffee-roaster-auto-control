  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;\n\n  componentDidMount(){\n    this.clock = setInterval(()=>this.setState({now:new Date()}),1000);\n    const upd={};\n    if(this.props.startLang) upd.lang=this.props.startLang;\n    if(this.props.demoSpeed) upd.speed=Number(this.props.demoSpeed);\n    if(Object.keys(upd).length) this.setState(upd);\n    this.onKey=(e)=>{ if(this.state.screen!=='login') return; if(e.key>='0'&&e.key<='9'){ this.pinPress(e.key); } else if(e.key==='Enter'){ this.pinEnter(); } else if(e.key==='Backspace'){ this.pinClear(); } };\n    window.addEventListener('keydown', this.onKey);\n  }\n  componentWillUnmount(){ clearInterval(this.clock); clearInterval(this.roastTimer); if(this.onKey) window.removeEventListener('keydown', this.onKey); }\n  componentDidUpdate(){ if(this.state.screen==='live') this.draw(); }\n\n  fmt(s){ s=Math.max(0,Math.floor(s)); const m=Math.floor(s/60), ss=s%60; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }\n  go = (screen)=>()=>this.setState({screen});\n\n  // ---- simulation ----\n  startRoast = ()=>{\n    const init={t:0,bean:205,drum:231,abt:239,burner:78,ror:0,etRor:0};\n    const r={ running:true, done:false, gas:78, fan:45, rpm:12, vacuum:1180, ...init,\n      history:[init], firstCrackAt:null, phase:'drying', events:{tp:null,de:null,fc:null,drop:null} };\n    this.setState({roast:r, ignited:true});\n    clearInterval(this.roastTimer);\n    this.roastTimer=setInterval(()=>this.tick(),200);\n  };\n  tick(){\n    const s=this.state, r=s.roast; if(!r||!r.running) return;\n    const p=this.PROFILES.find(x=>x.id===s.selectedProfileId)||this.PROFILES[0];\n    const gasFactor=0.55 + r.gas/100*0.95;\n    const fanCool=(r.fan/100)*0.18;\n    let t=r.t + s.speed*(gasFactor-fanCool);\n    const charge=205, tp=86, tpTime=78, drop=p.dropTemp, dropTime=p.dropTime;\n    let bean;\n    if(t<=tpTime){ bean=charge+(tp-charge)*(t/tpTime); }\n    else { let f=(t-tpTime)/(dropTime-tpTime); f=Math.min(f,1.3); bean=tp+(drop-tp)*(1-Math.pow(1-f,1.9)); }\n    const drum=bean + 26 + 18*Math.exp(-t/160);\n    const abt=drum + 7 + 9*Math.exp(-t/130);\n    const vacuum=Math.round(1050 + r.fan*5 + Math.sin(t/12)*30);\n    const prev=r.history[r.history.length-1];\n    let ror=0, etRor=0;\n    if(prev){ const dm=(t-prev.t)/60; if(dm>0){ ror=(bean-prev.bean)/dm; etRor=(drum-prev.drum)/dm; } ror=prev.ror*0.75+ror*0.25; etRor=prev.etRor*0.75+etRor*0.25; }\n    const point={t,bean,drum,abt,burner:r.gas,ror,etRor};\n    const hist=r.history.concat([point]);\n    const ev={...r.events};\n    if(ev.tp==null && t>=tpTime) ev.tp={temp:bean,time:t};\n    if(ev.de==null && bean>=150) ev.de={temp:bean,time:t};\n    let firstCrackAt=r.firstCrackAt, fcNow=false;\n    if(firstCrackAt==null && bean>=196 && t>tpTime){ firstCrackAt=t; ev.fc={temp:bean,time:t}; fcNow=true; }\n    let phase = (t<=tpTime || bean<150) ? 'drying' : (firstCrackAt==null ? 'maillard' : 'development');\n    let running=true, done=false;\n    if(t>=dropTime || bean>=drop){ running=false; done=true; t=Math.min(t,dropTime); ev.drop={temp:bean,time:t}; }\n    if(fcNow) this.beep(1046);\n    if(done) this.beep(660);\n    this.setState({roast:{...r,t,bean,drum,abt,vacuum,ror,etRor,history:hist,firstCrackAt,phase,running,done,events:ev}});\n    if(!running){ clearInterval(this.roastTimer); this.roastTimer=null; }\n  }\n  togglePause = ()=>{\n    const r=this.state.roast; if(!r||r.done) return;\n    if(r.running){ clearInterval(this.roastTimer); this.roastTimer=null; this.setState({roast:{...r,running:false}}); }\n    else { this.setState({roast:{...r,running:true}}); clearInterval(this.roastTimer); this.roastTimer=setInterval(()=>this.tick(),200); }\n  };\n  markFC = ()=>{ const r=this.state.roast; if(!r||r.firstCrackAt!=null) return; this.beep(1046); this.setState({roast:{...r,firstCrackAt:r.t,phase:'development',events:{...r.events,fc:{temp:r.bean,time:r.t}}}}); };\n  dropRoast = ()=>{ const r=this.state.roast; if(!r||r.done) return; clearInterval(this.roastTimer); this.roastTimer=null; this.beep(660); this.setState({roast:{...r,running:false,done:true,events:{...r.events,drop:{temp:r.bean,time:r.t}}}}); };\n  newBatch = ()=>{ clearInterval(this.roastTimer); this.roastTimer=null; this.setState({roast:null, ignited:false}); };\n  adjust(field,delta,min,max){ const r=this.state.roast; if(!r) return; const v=Math.max(min,Math.min(max,(r[field]||0)+delta)); this.setState({roast:{...r,[field]:v}}); }\n  gasUp=()=>this.adjust('gas',5,0,100); gasDown=()=>this.adjust('gas',-5,0,100);\n  fanUp=()=>this.adjust('fan',5,0,100); fanDown=()=>this.adjust('fan',-5,0,100);\n\n  loadProfile(p){ this.setState({selectedProfileId:p.id, screen:'live', roast:null}); }\n  toggleLang=()=>this.setState(s=>({lang:s.lang==='vi'?'en':'vi'}));\n  toggleSound=()=>this.setState(s=>({sound:!s.sound}));\n  onSpeed=(e)=>this.setState({speed:Number(e.target.value)});\n\n  beep(freq){ if(!this.state.sound) return; try{ const C=window.AudioContext||window.webkitAudioContext; if(!this.ac) this.ac=new C(); const o=this.ac.createOscillator(), g=this.ac.createGain(); o.frequency.value=freq; o.connect(g); g.connect(this.ac.destination); g.gain.value=0.05; o.start(); o.stop(this.ac.currentTime+0.12);}catch(e){} }\n\n  setCanvas=(el)=>{ this.canvas=el; if(el) requestAnimationFrame(()=>this.draw()); };\n  draw(){\n    const cv=this.canvas; if(!cv||!cv.clientWidth) return;\n    const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;\n    if(cv.width!==Math.round(W*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }\n    const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);\n    const padL=34,padR=32,padT=8,padB=18, x0=padL,x1=W-padR,y0=H-padB,y1=padT;\n    const Tmin=0,Tmax=300,tMax=720,rorMax=30;\n    const X=t=>x0+(t/tMax)*(x1-x0), Y=v=>y0+(v-Tmin)/(Tmax-Tmin)*(y1-y0), YR=r=>y0+(r/rorMax)*(y1-y0);\n    ctx.font='8px \"IBM Plex Mono\", monospace';\n    for(let v=Tmin; v<=Tmax; v+=50){ const y=Y(v); ctx.strokeStyle=
