[env:genericSTM32F103RC]
platform = ststm32
board = genericSTM32F103RC
framework = arduino
lib_deps = 
	arduino-libraries/SD@^1.2.4
	4-20ma/ModbusMaster@^2.0.1
	adafruit/Adafruit MCP4725@^2.0.0
	denyssene/SimpleKalmanFilter@^0.1.0