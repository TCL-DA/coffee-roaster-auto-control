; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; https://docs.platformio.org/page/projectconf.html
;
; ---------------------------------------------------------------------------
; MỌI PHIÊN BẢN Ở ĐÂY ĐỀU GHIM CHÍNH XÁC — CỐ Ý.
;
; Đây là firmware đang chạy trên máy rang bán cho khách. Một bản build lại phải
; ra đúng con firmware đã kiểm chứng, trên bất kỳ máy nào, ở bất kỳ thời điểm nào.
; Dùng "^" hay bỏ trống phiên bản là để PlatformIO tự nâng cấp lặng lẽ — nghĩa là
; con firmware nạp cho khách tháng sau có thể khác con đã test, mà không ai biết.
;
; Trước khi đổi bất kỳ số nào dưới đây: build lại, so `firmware.bin`, rồi chạy thử
; máy thật. Xem lib/ModbusESP/OTL_NOTE.md.
; ---------------------------------------------------------------------------

[env:genericSTM32F103RC]
platform = ststm32@19.1.0
board = genericSTM32F103RC
framework = arduino

; framework-arduinoststm32 4.21001.250617 = STM32duino core 2.10.1 (17/06/2025)
; toolchain 1.120301.0 = arm-none-eabi-gcc 12.3.1
platform_packages =
	platformio/framework-arduinoststm32@~4.21001.0
	platformio/toolchain-gccarmnoneeabi@~1.120301.0

lib_deps =
	arduino-libraries/SD@1.2.4
	4-20ma/ModbusMaster@2.0.1
	adafruit/Adafruit MCP4725@2.0.2
	adafruit/Adafruit BusIO@1.14.5
	denyssene/SimpleKalmanFilter@0.1.0
	khoih-prog/STM32_TimerInterrupt@1.3.0

; ModbusESP (Modbus RTU slave cho cổng Artisan) KHÔNG khai ở đây — nó nằm trong
; lib/ModbusESP của repo. Trước đây thư viện này bị lấy ngầm từ kho lib toàn cục
; của máy lập trình, nơi có HAI bản khác nhau cùng tên header. Xem OTL_NOTE.md.

; Env này đi cặp HMI v28 (110WS) — HMI CÓ ô "Chế độ xả khay" $M53 (Cài đặt › Hệ thống) nên firmware PHẢI nghe ô đó.
; 21/10/2026: trước đó build với cờ = 0 (mặc định Config.h cho HMI đời cũ) ⇒ gạt TẮT trên màn mà máy vẫn tự xả khay.
; HMI v28 từ LO111 tự đặt $M53 = 1 lần đầu bật (Lua macDinhM) để máy không ngừng xả khi vừa nạp bản này.
; Env dien / may3kg tự khai build_flags riêng (ghi đè dòng này) ⇒ vẫn = 0 như cũ.
build_flags = -DMACHINE_HAS_AUTO_ESCAPE_SWITCH=1

; ---------------------------------------------------------------------------
; MÁY RANG ĐIỆN — đồng hồ nhiệt buồng Hanyoung VX4 (14/10/2026). Cùng mã nguồn, chỉ bật cờ MACHINE_HEAT_ELECTRIC_VX4
; (include/Config.h): VX4 ID 6 đọc nhiệt buồng + firmware ghi SV từ 'Nhiệt %' (160..370 °C, 16/10); phản hồi "bếp chạy" ở chân CH1.
; BT / ET / biến tần đi dây vào CỔNG LOADER-CÂN (USART3), VX4 RIÊNG cổng Modbus cũ -> MACHINE_RS485_ON_SCALE_PORT (Define.h).
;   pio run -e dien            dựng
;   pio run -e dien -t upload  nạp (ST-Link)
; ---------------------------------------------------------------------------
[env:dien]
extends = env:genericSTM32F103RC
; VX4 đọc RIÊNG qua cổng Modbus cũ ở 9600 (đo trên máy 14/10: 38400 -> 0xE0 sai ID, 9600 -> VX4 OK)
; Gió qua RS485 45..60 Hz (biến tần ID 5, không vacuum) — chủ máy 14/10
build_flags = -DMACHINE_HEAT_ELECTRIC_VX4=1 -DMACHINE_RS485_ON_SCALE_PORT=1 -DVX4_SERIAL_BAUD=9600UL -DMACHINE_AIR_HZ_RS485=1

; ---------------------------------------------------------------------------
; MÁY 3 KG — HMI ĐỜI CŨ (không có màn Cấu hình máy $M62), 19/10/2026. Hồ sơ: docs/config/config-3kg-auto-io-1910.md
; Không VR (gas / gió / trống trên HMI) · vacuum đọc ACI biến tần gió ID 5 · trống biến tần ID 4 · relay ngoài ID 7
; (CH1 trống/quạt, CH2 khuấy) · loader KHÔNG cân (nạp theo giây) · đốt khói · tách đá · bếp THƯỜNG mồi 50 %.
; MACHINE_OPT_FIXED 0x8E2C = bit 2 vacuum · 3 loader · 5 relay ngoài · 9 đốt khói · 10 tách đá · 11 khuấy riêng · 15 đã cấu hình
;   pio run -e may3kg            dựng
;   pio run -e may3kg -t upload  nạp (ST-Link)
; ---------------------------------------------------------------------------
[env:may3kg]
extends = env:genericSTM32F103RC
build_flags = -DMACHINE_OPT_FIXED=0x8E2C -DMACHINE_BATCH_KG=3 -DMACHINE_HAS_SCALE_FEEDER=0 -DMACHINE_BURNER_FORCE_STANDARD=1 -DPH_IGNITE_GAS=50 -DPH_TUNE_GAS_HI=50
